# Builds and publishes the AdGuard VPN -> WireGuard bridge container image.
#
# This is separate from the release plumbing in this repository: those workflows
# react to `release` events and mirror upstream AdGuard releases, while this one
# only reacts to changes under bridge/. It never touches scripts/.
name: Build bridge image

on:
  push:
    branches: ['**']
    paths:
      - 'bridge/**'
      - 'scripts/release/install.sh'
      - '.github/workflows/bridge-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: bridge-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      # The image name has to be lowercase; repository owners may not be.
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/adguard-wg-bridge" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short

      # The build context is the repository root: the Dockerfile consumes the
      # official scripts/release/install.sh to install the AdGuard client.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bridge/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Bridge image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Pull it on the server with \`docker compose pull\`."
          } >> "$GITHUB_STEP_SUMMARY"
