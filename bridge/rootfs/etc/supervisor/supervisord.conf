[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid
user=root

[unix_http_server]
file=/run/supervisor.sock

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; The control panel. Bound to all interfaces inside the container; the compose
; file only publishes it on 127.0.0.1, and the tunnel reaches it on 10.8.0.1.
[program:panel]
command=/opt/panel-venv/bin/python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8080 --no-access-log
directory=/opt/panel
autostart=true
autorestart=true
startretries=999
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

; Translates IP packets from tun0 into connections through AdGuard's SOCKS5
; proxy. Restarted by the watchdog whenever the AdGuard connection is rebuilt,
; because the proxy listener is recreated each time.
[program:tun2socks]
command=/usr/local/bin/tun2socks -device tun0 -proxy socks5://127.0.0.1:1080 -loglevel warning
autostart=true
autorestart=true
startretries=999
startsecs=3
stdout_logfile=/data/tun2socks.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
redirect_stderr=true
priority=20

; Auto-reconnect and kill-switch control.
[program:watchdog]
command=/usr/local/bin/bridge-watchdog.sh
directory=/opt/panel
autostart=true
autorestart=true
startretries=999
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
